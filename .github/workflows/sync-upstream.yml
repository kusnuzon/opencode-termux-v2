name: Sync upstream opencode v2

# Watches the official OpenCode V2 version (package @opencode/cli), bumps the
# VERSION file and publishes the mirror release for this repo.
#
# The payload is NOT attached to the release (~100 MB); install.sh downloads it
# straight from the npm registry with sha512 verification, so releases stay light.

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Target version (optional, e.g. 2.1.2). Empty = latest.'
        required: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Resolve the latest V2 version
        env:
          TARGET: ${{ github.event.inputs.version }}
        run: |
          ver="$TARGET"
          if [ -z "$ver" ]; then
            ver=$(curl -fsSL --max-time 30 https://opencode.ai/update/api/latest/cli/npm \
              | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' | head -1)
          fi
          if [ -z "$ver" ]; then
            echo "Could not resolve the OpenCode V2 version" >&2
            exit 1
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "OpenCode V2: $ver"

      - id: bump
        name: Bump the VERSION file
        env:
          VER: ${{ steps.meta.outputs.ver }}
        run: |
          current=$(cat VERSION)
          if [ "$current" = "$VER" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already version $VER, nothing to do."
            exit 0
          fi
          echo "$VER" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git diff --staged --quiet || git commit -m "chore: opencode v2 $VER"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish the mirror release
        if: steps.bump.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: opencode-termux-v2-${{ steps.meta.outputs.ver }}
          name: opencode v2 ${{ steps.meta.outputs.ver }} (Termux / Android)
          body: |
            OpenCode V2 ${{ steps.meta.outputs.ver }} mirror for Termux/Android.

            - Official binary: `@opencode/cli-linux-arm64` from the npm registry (downloaded and sha512-verified by `install.sh`)
            - Launcher: `opencode-v2-launcher` (runs the binary through the Termux glibc loader; the background service is started manually because V2's `process.execPath` is the loader path)
            - Built-in updater: the TUI `/update` command works — the injected payload is adopted by the launcher on the next start

            Install on Termux:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/kusnuzon/opencode-termux-v2/main/install.sh | bash
            ```

            Update:
            ```bash
            opencode-v2 upgrade
            ```
          prerelease: false

      - name: Summary
        run: echo "Checked OpenCode V2 ${{ steps.meta.outputs.ver }}."
