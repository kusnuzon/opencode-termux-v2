name: Sync upstream opencode v2

# Watches the official OpenCode V2 version (package @opencode/cli), bumps the
# VERSION file and publishes the mirror release for this repo.
#
# The payload is attached to the release as opencode-v2-linux-arm64.tar.gz plus
# a .sha256 file, exactly like the V1 repo. install.sh tries that GitHub mirror
# first, so a slow or blocked npm registry no longer breaks installs. The npm
# registry remains the fallback source.

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Target version (optional, e.g. 2.1.2). Empty = latest.'
        required: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Resolve the latest V2 version
        env:
          TARGET: ${{ github.event.inputs.version }}
        run: |
          ver="$TARGET"
          if [ -z "$ver" ]; then
            ver=$(curl -fsSL --max-time 30 https://opencode.ai/update/api/latest/cli/npm \
              | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' | head -1)
          fi
          if [ -z "$ver" ]; then
            echo "Could not resolve the OpenCode V2 version" >&2
            exit 1
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "OpenCode V2: $ver"

      - id: bump
        name: Bump the VERSION file
        env:
          VER: ${{ steps.meta.outputs.ver }}
        run: |
          current=$(cat VERSION)
          if [ "$current" = "$VER" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already version $VER, nothing to do."
            exit 0
          fi
          echo "$VER" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git diff --staged --quiet || git commit -m "chore: opencode v2 $VER"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - id: payload
        name: Build the mirror payload asset
        if: steps.bump.outputs.changed == 'true'
        env:
          VER: ${{ steps.meta.outputs.ver }}
        run: |
          set -euo pipefail
          ver="$VER"
          scope="@opencode"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/${scope}%2fcli-linux-arm64/${ver}")
          if [ "$code" = "404" ]; then
            scope="@opencode-ai"
          fi
          meta=$(curl -fsSL --retry 3 \
            "https://registry.npmjs.org/${scope}%2fcli-linux-arm64/${ver}")
          tarball=$(printf '%s' "$meta" | jq -r '.dist.tarball')
          integrity=$(printf '%s' "$meta" | jq -r '.dist.integrity')
          curl -fL --retry 3 --retry-delay 5 -o payload.tgz "$tarball"
          expected=$(printf '%s' "${integrity#sha512-}" | base64 -d \
            | od -An -tx1 | tr -d ' \n')
          actual=$(sha512sum payload.tgz | cut -d' ' -f1)
          if [ "$expected" != "$actual" ]; then
            echo "npm tarball sha512 mismatch" >&2
            exit 1
          fi
          tar -xzf payload.tgz
          cp package/bin/opencode opencode
          tar -czf opencode-v2-linux-arm64.tar.gz opencode
          rm -f opencode payload.tgz
          sha256sum opencode-v2-linux-arm64.tar.gz \
            > opencode-v2-linux-arm64.tar.gz.sha256
          ls -lh opencode-v2-linux-arm64.tar.gz*

      - name: Publish the mirror release
        if: steps.bump.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: opencode-termux-v2-${{ steps.meta.outputs.ver }}
          name: opencode v2 ${{ steps.meta.outputs.ver }} (Termux / Android)
          body: |
            OpenCode V2 ${{ steps.meta.outputs.ver }} mirror for Termux/Android.

            - Payload: `opencode-v2-linux-arm64.tar.gz` (official `@opencode/cli-linux-arm64`) with a `.sha256` checksum — the same GitHub-release mechanism as the V1 repo
            - Source order: GitHub mirror first, npm registry as fallback
            - Launcher: `opencode-v2-launcher` (runs the binary through the Termux glibc loader; the background service is started manually because V2's `process.execPath` is the loader path)
            - Built-in updater: the TUI `/update` command works — the injected payload is adopted by the launcher on the next start

            Install on Termux:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/kusnuzon/opencode-termux-v2/main/install.sh | bash
            ```

            Update:
            ```bash
            opencode-v2 upgrade
            ```
          prerelease: false
          files: |
            opencode-v2-linux-arm64.tar.gz
            opencode-v2-linux-arm64.tar.gz.sha256

      - name: Summary
        run: echo "Checked OpenCode V2 ${{ steps.meta.outputs.ver }}."
